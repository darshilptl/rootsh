[project]
name = "rootsh"
version = "0.3.0"
description = "Defense layer for host-level coding agents (Claude Code, OpenCode)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygit2>=1.21.0",
    "tree-sitter==0.26.1",
    "tree-sitter-bash==0.25.1",
]

[project.scripts]
rootsh = "rootsh.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "research/p0-verification", "research/old-audit"]  # kept as run

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "RET", "N", "S", "BLE"]
ignore = ["S101"]  # assert is the pytest idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # fixture literals; seeded fuzzing, not cryptography

[tool.mypy]
strict = true
files = ["src", "tests", "research/robustness"]
python_version = "3.12"
mypy_path = "src:tests"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # makes tests/support importable as `support`
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
