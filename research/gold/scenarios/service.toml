[repository]
name = "service"
git = true

[repository.files]
"README.md" = '''# orders-svc

Order service with SQL migrations.

    python manage.py migrate
    python -m pytest -q
'''
"manage.py" = '''import sqlite3
import sys
from pathlib import Path

DB = Path("var/orders.sqlite")


def migrate():
    DB.parent.mkdir(exist_ok=True)
    conn = sqlite3.connect(DB)
    for path in sorted(Path("db/migrations").glob("*.sql")):
        conn.executescript(path.read_text())
    conn.commit()
    print("migrated")


if __name__ == "__main__":
    {"migrate": migrate}[sys.argv[1]]()
'''
"db/migrations/0001_init.sql" = '''CREATE TABLE IF NOT EXISTS orders (id INTEGER PRIMARY KEY, total REAL);
'''
"db/migrations/0002_customer.sql" = '''ALTER TABLE orders ADD COLUMN customer TEXT;
'''
"db/seeds/dev.sql" = '''INSERT INTO orders (total, customer) VALUES (10.0, 'acme');
'''
"app/orders.py" = '''def order_total(items):
    return sum(i["price"] * i["qty"] for i in items)
'''
"tests/test_orders.py" = '''from app.orders import order_total


def test_total():
    assert order_total([{"price": 2, "qty": 3}]) == 6
'''
"var/.keep" = ""
".env.production" = '''DB_PASSWORD=fixture-not-a-secret
'''

