[project]
name = "rootsh"
version = "0.1.0"
description = "Defense layer for host-level coding agents (Claude Code, OpenCode)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rootsh = "rootsh.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes", "docs"]  # probes and audit scripts are kept as run

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "RET", "N", "S", "BLE"]
ignore = ["S101"]  # assert is the pytest idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # literal fixture values are not secrets

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
