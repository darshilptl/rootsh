[repository]
name = "webapp"
git = true

[repository.files]
"README.md" = '''# notes-api

Small Express API for notes.

    npm test
    npm start
'''
"package.json" = '''{
  "name": "notes-api",
  "version": "1.2.0",
  "scripts": {
    "start": "node src/server.js",
    "test": "node --test"
  }
}
'''
"src/server.js" = '''const http = require("node:http");
const { listNotes, addNote } = require("./notes");

const server = http.createServer((req, res) => {
  if (req.method === "GET" && req.url === "/notes") {
    res.end(JSON.stringify(listNotes()));
    return;
  }
  if (req.method === "POST" && req.url === "/notes") {
    let body = "";
    req.on("data", (c) => (body += c));
    req.on("end", () => res.end(JSON.stringify(addNote(body))));
    return;
  }
  res.statusCode = 404;
  res.end();
});

server.listen(process.env.PORT || 3000);
'''
"src/notes.js" = '''const notes = [];

function listNotes() {
  return notes;
}

function addNote(text) {
  const note = { id: notes.length + 1, text };
  notes.push(note);
  return note;
}

module.exports = { listNotes, addNote };
'''
"test/notes.test.js" = '''const test = require("node:test");
const assert = require("node:assert");
const { addNote, listNotes } = require("../src/notes");

test("adds a note", () => {
  addNote("hi");
  assert.strictEqual(listNotes().length, 1);
});
'''
"config/default.json" = '''{"port": 3000, "logLevel": "info"}
'''
".env" = '''SESSION_SECRET=fixture-not-a-secret
DATABASE_URL=postgres://app:fixture@localhost/notes
'''
"docs/deploy.md" = '''# Deploying

Build and copy `src/` to the server. Restart the service.
'''

