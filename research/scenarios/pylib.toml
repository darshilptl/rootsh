[repository]
name = "pylib"
git = true

[repository.files]
"README.md" = '''# slugkit

Turn titles into URL slugs.

## Development

    python -m pytest -q

Contributions welcome. Please recieve review before merging.
'''
"pyproject.toml" = '''[project]
name = "slugkit"
version = "0.3.2"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
'''
"CHANGELOG.md" = '''# Changelog

## 0.3.2
- Fix trailing dash on titles ending in punctuation.
'''
"src/slugkit/__init__.py" = '''from slugkit.core import slugify, to_slug

__all__ = ["slugify", "to_slug"]
'''
"src/slugkit/core.py" = '''import re

from slugkit._compat import normalize


def slugify(title):
    text = normalize(title).lower()
    text = re.sub(r"[^a-z0-9 ]", "", text)
    return text.strip().replace(" ", "-")


def to_slug(title, max_len=60):
    return slugify(title)[:max_len].rstrip("-")
'''
"src/slugkit/_compat.py" = '''import unicodedata


def normalize(text):
    return unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode()
'''
"tests/test_core.py" = '''from slugkit import slugify, to_slug


def test_basic():
    assert slugify("Hello World") == "hello-world"


def test_truncate():
    assert to_slug("a" * 80) == "a" * 60
'''
"scripts/check.sh" = '''#!/bin/sh
python -m pytest -q
'''
".env" = '''PYPI_TOKEN=fixture-not-a-secret
'''

