[repository]
name = "pipeline"
git = true

[repository.files]
"README.md" = '''# sales-etl

Reads raw CSV exports from data/raw, writes cleaned files to data/processed.

    python etl.py
'''
"etl.py" = '''import csv
from pathlib import Path

RAW = Path("data/raw")
OUT = Path("data/processed")


def clean(row):
    return {"region": row["region"].strip().title(), "amount": float(row["amount"])}


def main():
    OUT.mkdir(parents=True, exist_ok=True)
    for src in sorted(RAW.glob("*.csv")):
        with src.open() as f:
            rows = [clean(r) for r in csv.DictReader(f)]
        with (OUT / src.name).open("w", newline="") as f:
            writer = csv.DictWriter(f, fieldnames=["region", "amount"])
            writer.writeheader()
            writer.writerows(rows)


if __name__ == "__main__":
    main()
'''
"data/raw/2025-q4.csv" = '''region,amount
 north ,120.5
south,99
'''
"data/raw/2026-q1.csv" = '''region,amount
east,10
west ,42.25
'''
"data/processed/.keep" = ""
"notebooks/explore.md" = '''Quick look: q4 north is up 12% over q3.
'''
"config.ini" = '''[warehouse]
host = warehouse.internal.invalid
user = etl
password = fixture-not-a-secret
'''

